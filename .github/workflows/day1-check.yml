name: Day 1 Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in README.md docs/analysis.md docs/requirements.md docs/tz.md docs/stakeholders.md; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              if [ "$SIZE" -lt 500 ]; then
                echo "FAIL: $f is too small"
                exit 1
              fi
            else
              echo "FAIL: $f not found"
              exit 1
            fi
          done
      - name: Check User Stories
        run: |
          COUNT=$(grep -c "Как " docs/requirements.md || echo 0)
          if [ "$COUNT" -lt 10 ]; then exit 1; fi
      - name: Check NFR
        run: |
          COUNT=$(grep -c "NFR-" docs/requirements.md || echo 0)
          if [ "$COUNT" -lt 5 ]; then exit 1; fi
      - name: All checks passed
        run: echo "ALL CHECKS PASSED"
